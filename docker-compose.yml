name: NovaGate CI/CD

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-novagate.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

  control-plane:
    image: ghcr.io/mayank-rawat98/control-plane:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WS_PORT: ${WS_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gateway-net
      - edge # reached by the shared Caddy in the squadup stack

  admin-api:
    image: ghcr.io/mayank-rawat98/admin-api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:${WS_PORT:-8080}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      DASHBOARD_URL: ${DASHBOARD_URL}
      SMTP_API_KEY: ${SMTP_API_KEY}
      SMTP_API_BASE_URL: ${SMTP_API_BASE_URL:-https://api.mailtr.co}
      SMTP_FROM: ${SMTP_FROM:-support@novagate.dev}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gateway-net
      - edge # reached by the shared Caddy in the squadup stack

  dashboard:
    image: ghcr.io/mayank-rawat98/dashboard:latest
    environment:
      ADMIN_API_URL: http://admin-api:3001
      PORT: 3003
      HOSTNAME: '0.0.0.0'
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3003/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gateway-net
      - edge # reached by the shared Caddy in the squadup stack

networks:
  gateway-net:
    driver: bridge

  # TLS and routing for novagate.dev are handled by the Caddy in the squadup
  # stack (squadup.in/caddy/Caddyfile), which owns ports 80/443 on the server.
  # The fixed name lets that stack join this network as an external one, and
  # only the three public services sit on it, so Caddy can't reach Postgres
  # or Redis.
  edge:
    name: novagate-edge
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
