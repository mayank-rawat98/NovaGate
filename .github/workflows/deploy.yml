name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ── Detect which apps are affected by this push ────────────────────────────
  detect:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.check.outputs.gateway }}
      control-plane: ${{ steps.check.outputs.control-plane }}
      admin-api: ${{ steps.check.outputs.admin-api }}
      dashboard: ${{ steps.check.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - id: check
        run: |
          # On tags or manual trigger: always build everything
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "gateway=true"        >> $GITHUB_OUTPUT
            echo "control-plane=true"  >> $GITHUB_OUTPUT
            echo "admin-api=true"      >> $GITHUB_OUTPUT
            echo "dashboard=true"      >> $GITHUB_OUTPUT
            exit 0
          fi

          # First-ever push to main (no previous SHA): build everything
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "gateway=true"        >> $GITHUB_OUTPUT
            echo "control-plane=true"  >> $GITHUB_OUTPUT
            echo "admin-api=true"      >> $GITHUB_OUTPUT
            echo "dashboard=true"      >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise use Nx affected to find what changed
          AFFECTED=$(npx nx show projects --affected --base=$BEFORE --head=HEAD 2>/dev/null || echo "api control-plane admin-api dashboard")
          echo "$AFFECTED"

          echo "gateway=$(echo "$AFFECTED"       | grep -qw 'api'           && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "control-plane=$(echo "$AFFECTED" | grep -qw 'control-plane' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "admin-api=$(echo "$AFFECTED"     | grep -qw 'admin-api'     && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "dashboard=$(echo "$AFFECTED"     | grep -qw 'dashboard'     && echo true || echo false)" >> $GITHUB_OUTPUT

  # ── Build gateway image (public — customers pull this) ─────────────────────
  build-gateway:
    name: Build gateway
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.gateway == 'true'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/novagate/api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  # ── Build control-plane ────────────────────────────────────────────────────
  build-control-plane:
    name: Build control-plane
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.control-plane == 'true'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/control-plane
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,scope=control-plane,mode=max

  # ── Build admin-api ────────────────────────────────────────────────────────
  build-admin-api:
    name: Build admin-api
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.admin-api == 'true'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/admin-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-api
          cache-to: type=gha,scope=admin-api,mode=max

  # ── Build dashboard (NEXT_PUBLIC_ADMIN_API_URL baked in at build time) ─────
  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.dashboard == 'true'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/dashboard
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ADMIN_API_URL=${{ secrets.NEXT_PUBLIC_ADMIN_API_URL }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  # ── Deploy SaaS stack to production server ─────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build-gateway, build-control-plane, build-admin-api, build-dashboard]
    # Run even if some build jobs were skipped, but not if any failed
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_PRODUCTION,GHCR_PAT,GHCR_USER
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /root/app
            git pull origin main

            printf '%s' "$ENV_PRODUCTION" > .env.production

            docker compose --env-file .env.production pull
            docker compose --env-file .env.production --profile production up -d --remove-orphans

            docker image prune -f
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
