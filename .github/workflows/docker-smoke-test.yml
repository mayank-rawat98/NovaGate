name: Docker Smoke Test

on:
  pull_request:

jobs:
  smoke-test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build gateway image
        run: docker build -f docker/Dockerfile.api -t gateway-smoke:test .

      - name: Smoke test
        run: |
          docker run --rm \
            -e GATEWAY_MODE=single \
            -e REDIS_URL=redis://localhost:6379 \
            gateway-smoke:test \
            node -e "console.log('ok')"
