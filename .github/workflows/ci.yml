name: CI

on:
  pull_request:
    branches: ['dev']
  push:
    branches: ['dev']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novagate_test
          POSTGRES_PASSWORD: local-verification-only
          POSTGRES_DB: novagate_test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U novagate_test -d novagate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm exec nx run-many -- -t lint

      - name: Typecheck
        run: npm exec nx run-many -- -t typecheck

      - name: Test
        run: npm exec nx run-many -- -t test --skipNxCache
        env:
          CI: 'true'
          TEST_DATABASE_URL: postgres://novagate_test:local-verification-only@127.0.0.1:15432/novagate_test
          TEST_REDIS_URL: redis://127.0.0.1:16379

      - name: Build
        run: npm exec nx run-many -- -t build
