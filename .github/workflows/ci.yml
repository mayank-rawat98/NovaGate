name: CI

on:
  push:
    branches: ['dev']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npx nx run-many -t lint

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Test
        run: npx nx run-many -t test
        env:
          CI: 'true'

      - name: Build
        run: npx nx run-many -t build
