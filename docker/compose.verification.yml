name: novagate-verification

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novagate_test
      POSTGRES_PASSWORD: local-verification-only
      POSTGRES_DB: novagate_test
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-novagate.sql:ro
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novagate_test -d novagate_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
