events {
    worker_connections 1024;
}

http {
    # ── Redirect all HTTP to HTTPS ────────────────────────────────────────────

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Dashboard  (app.squadup.in) ───────────────────────────────────────

    server {
        listen 443 ssl http2;
        server_name squadup.in;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://dashboard:3003;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Admin API  (api.squadup.in) ───────────────────────────────────────
    # Browser-facing REST API consumed by the dashboard

    server {
        listen 443 ssl http2;
        server_name api.squadup.in;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://admin-api:3001;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Control Plane WebSocket  (ws.squadup.in) ──────────────────────────
    # Customer gateways connect here: CONTROL_PLANE_URL=wss://ws.squadup.in/gateway-ws

    server {
        listen 443 ssl http2;
        server_name ws.squadup.in;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /gateway-ws {
            proxy_pass http://control-plane:8080;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }
    }

}
